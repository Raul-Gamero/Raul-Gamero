<svg xmlns="http://www.w3.org/2000/svg" width="144" height="56" viewBox="0 0 144 56" role="img" aria-label="Email">
<title>Email</title>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}
.b{font-weight:700}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.2,.8,.2,1) both}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade 1s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.s{animation:s 5s ease-in-out 1s infinite}@keyframes s{0%{transform:translateX(0)}30%,100%{transform:translateX(344px)}}</style>
<defs><clipPath id="bc"><rect width="144" height="56" rx="12"/></clipPath>
<linearGradient id="bs" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<g clip-path="url(#bc)"><rect width="144" height="56" fill="#1B2436"/>
<g class="s"><rect x="-120" y="-10" width="70" height="76" fill="url(#bs)" transform="skewX(-20)"/></g></g>
<rect x=".75" y=".75" width="142.5" height="54.5" rx="11.5" fill="none" stroke="#33415C" stroke-width="1.5"/>
<svg x="22" y="16" width="24" height="24" viewBox="0 0 24 24"><path fill="#EA4335" d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg>
<text class="sans" x="60" y="35" font-size="18" font-weight="700" fill="#fff" text-anchor="start" >Email</text>
